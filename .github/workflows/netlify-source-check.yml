name: Netlify source deployment check

on:
  push:
    branches: [main]
    paths:
      - 'public/verified-sources.json'
      - '.github/workflows/netlify-source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-status:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for Netlify to serve the source snapshot
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          expected = {s['url'] for s in json.load(open('public/verified-sources.json'))['sources']}
          url = 'https://jokergxtv.netlify.app/api/status'
          for attempt in range(24):
              try:
                  req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(req, timeout=10) as response:
                      data = json.load(response)
                  actual = {s['url'] for s in data.get('defaultSources', [])}
                  print('NETLIFY_DEPLOY', json.dumps({'attempt': attempt + 1, 'expected': len(expected), 'actual': len(actual), 'snapshotMatches': actual == expected}), flush=True)
                  if actual == expected:
                      break
              except Exception as exc:
                  print('Netlify status request:', str(exc), flush=True)
              time.sleep(10)
          else:
              raise SystemExit('Netlify has not served this source snapshot yet; inspect its deployment status.')
          PY
