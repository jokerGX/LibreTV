name: Source connectivity and validation

on:
  push:
    branches: [codex/verified-vod-sources]
    paths:
      - 'scripts/check-sources.py'
      - 'data/source-candidates.json'
      - '.github/workflows/source-health.yml'
      - 'src/lib/env-sources*'
      - 'public/*sources.json'
      - 'docs/source-connectivity.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-status:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect Netlify public status
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url = 'https://jokergxtv.netlify.app/api/status'
          with urllib.request.urlopen(url, timeout=20) as response:
              data = json.load(response)
          print('NETLIFY_STATUS', json.dumps({'version': data.get('version'), 'passwordRequired': data.get('passwordRequired'), 'sourceCount': len(data.get('defaultSources', [])), 'sources': [{'name': s['name'], 'url': s['url']} for s in data.get('defaultSources', [])]}))
          PY
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check API, relevant search, details, HLS and segment
        run: python3 scripts/check-sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-connectivity-report
          path: source-check-output/
          retention-days: 14

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          PASSWORD: source-check-build-only
